<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Shajedul Kabir Rafi — Software Engineer</title>
<desc id="desc">Burgundy and cream editorial banner with the name RAFI, a monogram, and the phrase Ideas Made Real.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a0b11"/><stop offset=".51" stop-color="#10080c"/><stop offset="1" stop-color="#070608"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#922a32" stop-opacity=".78"/><stop offset=".48" stop-color="#621820" stop-opacity=".43"/><stop offset="1" stop-color="#621820" stop-opacity="0"/></radialGradient>
  <linearGradient id="type" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffebd3"/><stop offset="1" stop-color="#d8ad91"/></linearGradient>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#efd6be" stroke-opacity=".055" stroke-width="1"/></pattern>
  <clipPath id="frame"><rect x="0" y="0" width="1200" height="370" rx="10"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="370" fill="url(#bg)"/>
  <rect width="1200" height="370" fill="url(#grid)"/>
  <circle cx="957" cy="189" r="320" fill="url(#glow)"/>
  <circle cx="954" cy="180" r="155" fill="none" stroke="#c96f69" stroke-opacity=".25" stroke-width="1.5"/>
  <circle cx="954" cy="180" r="125" fill="#5a171f" fill-opacity=".22"/>
  <path d="M954 14V345M787 180H1120" stroke="#d5a892" stroke-opacity=".12" stroke-width="1"/>
  <rect x="34" y="34" width="1132" height="302" rx="2" fill="none" stroke="#d7a98e" stroke-opacity=".26"/>
  <path d="M66 67H151 M66 303H155 M1048 304H1134" stroke="#c2736a" stroke-width="2"/>
  <text x="66" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#caa99a">PORTFOLIO  /  PERSONAL WORK  /  2026</text>
  <text x="60" y="174" font-family="Arial Narrow, Impact, Arial, sans-serif" font-size="67" font-stretch="condensed" font-weight="900" letter-spacing="3" fill="#f3d7bd">SHAJEDUL KABIR</text>
  <text x="58" y="287" font-family="Georgia, Times New Roman, serif" font-size="130" letter-spacing="-8" fill="url(#type)">RAFI<tspan fill="#bb6259">.</tspan></text>
