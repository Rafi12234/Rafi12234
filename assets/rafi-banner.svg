  <text x="954" y="228" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="165" font-weight="400" fill="#ebcfb7" opacity=".96">R</text>
  <text x="953" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" letter-spacing="1.2" fill="#e7c1a8">Ideas Made Real.</text>
  <path d="M120 114H670" stroke="#e9c8ae" stroke-opacity=".13" stroke-width="1"/>
